<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Login – YASH CATERERS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#e3bd6a;--gold-2:#b8893a;--gold-3:#f6dd9b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#f4ead2;
    font-family:'Montserrat',system-ui,sans-serif;
    background:radial-gradient(120% 80% at 50% 0%,#1a1f4d 0%,#0b1233 30%,#050505 75%)}
  .card{width:100%;max-width:380px;border:1px solid rgba(227,189,106,.45);border-radius:20px;padding:30px 24px;background:rgba(0,0,0,.55);text-align:center}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;margin:0;color:var(--gold-3);letter-spacing:.05em}
  p.sub{margin:4px 0 22px;font-size:11px;letter-spacing:.28em;color:var(--gold)}
  label{display:block;text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;margin-bottom:6px}
  input{width:100%;padding:13px;font-size:16px;border-radius:10px;background:#0a0a0a;border:1px solid #4a3d1f;color:#fff;outline:none}
  input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,189,106,.18)}
  button{width:100%;margin-top:16px;min-height:50px;border:0;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.12em;cursor:pointer;
    background:linear-gradient(180deg,var(--gold-3),var(--gold) 45%,var(--gold-2));color:#1a1204}
  .err{color:#ff8a8d;font-size:13px;margin:12px 0 0}
  a{display:inline-block;margin-top:18px;color:#aaa;font-size:12px;text-decoration:none}
</style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('admin_login') }}" autocomplete="off">
    <h1>YASH CATERERS</h1>
    <p class="sub">OWNER LOGIN</p>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
    <button type="submit">LOGIN</button>
    <a href="{{ url_for('index') }}">&larr; Back to website</a>
  </form>
</body>
</html>
